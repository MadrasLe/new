<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Strategy Game</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="top-bar">
            <div class="resource">💰 <span id="money">1000000</span></div>
            <div class="resource">🛢️ <span id="fuel">5000</span></div>
            <div class="resource">👥 <span id="manpower">25000</span></div>
            <div class="date-display">📅 <span id="game-date">2024-01-01</span></div>
        </div>

        <div id="info-panel" class="hidden">
            <h2 id="panel-title">Detalhes</h2>
            <p id="panel-content">Selecione uma unidade ou território.</p>
            <button id="action-btn">Ação</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <!-- Game Logic -->
    <script src="js/game.js"></script>
</body>
</html>
